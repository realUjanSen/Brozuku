name: Build Shizuku with Custom Package Name

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Custom package name (e.g., com.renamed.sh1zuku)'
        required: true
        default: 'com.renamed.sh1zuku'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with custom package name
        env:
          CUSTOM_PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.renamed.sh1zuku' }}
        run: |
          ./gradlew :manager:assembleDebug \
            -PcustomApplicationId="${CUSTOM_PACKAGE_NAME}"

      - name: Build Release APK with custom package name
        env:
          CUSTOM_PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.renamed.sh1zuku' }}
        run: |
          ./gradlew :manager:assembleRelease \
            -PcustomApplicationId="${CUSTOM_PACKAGE_NAME}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-debug
          path: manager/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-release
          path: manager/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: List build outputs
        run: |
          echo "Debug APKs:"
          find manager/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "Release APKs:"
          find manager/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \;
